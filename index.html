<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Treino - App Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom scrollbar para visual mais limpo */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans pb-24">

    <header class="bg-gray-800 shadow-md sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-emerald-400"><i class="fa-solid fa-bolt"></i> Home Workout</h1>
                <p class="text-xs text-gray-400">Local Storage App</p>
            </div>
            <div class="flex gap-2">
                <label for="importBtn" class="cursor-pointer bg-gray-700 hover:bg-gray-600 text-white p-2 rounded-lg text-sm transition">
                    <i class="fa-solid fa-file-import"></i>
                </label>
                <input type="file" id="importBtn" accept=".json" class="hidden" onchange="importData(event)">
                <button onclick="exportData()" class="bg-gray-700 hover:bg-gray-600 text-white p-2 rounded-lg text-sm transition">
                    <i class="fa-solid fa-file-export"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto space-y-6 p-4">
        
        <section class="bg-gray-800 p-4 rounded-xl border border-gray-700">
            <label class="block text-sm font-medium text-gray-400 mb-2">Dia do Treino:</label>
            <select id="workoutSelect" class="w-full bg-gray-900 text-white p-3 rounded-lg border border-gray-600 focus:outline-none focus:border-emerald-500" onchange="loadWorkout()">
                <option value="segunda">Segunda-feira: Superiores (Força)</option>
                <option value="quarta">Quarta-feira: Corrida (Ritmo)</option>
                <option value="sexta">Sexta-feira: Inferiores e Core (Força)</option>
                <option value="domingo">Domingo: Corrida (Longo)</option>
            </select>
        </section>

        <section id="exerciseContainer" class="space-y-4"></section>

        <button onclick="saveProgress()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-4 px-4 rounded-xl transition duration-200 shadow-lg mb-8">
            <i class="fa-solid fa-floppy-disk mr-2"></i> Salvar Treino de Hoje
        </button>
    </main>

    <div id="timerBar" class="fixed bottom-0 left-0 w-full bg-gray-800 border-t border-gray-700 p-4 transform translate-y-full transition-transform duration-300 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.3)]">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-stopwatch text-2xl text-emerald-400"></i>
                <div>
                    <p class="text-xs text-gray-400">Descanso</p>
                    <p id="timeDisplay" class="text-2xl font-mono font-bold text-white">00:00</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="addTime(30)" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-sm text-gray-200">+30s</button>
                <button onclick="stopTimer()" class="bg-red-500/20 text-red-400 hover:bg-red-500/30 px-3 py-1 rounded text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Banco de dados do treino (Substitua as URLs de imagens pelas que você preferir)
        const workouts = {
            segunda: [
                { name: "Supino Reto (Barra Maciça)", desc: "4 séries de 8-10 reps", img: "https://placehold.co/600x300/1f2937/10b981?text=Supino+Reto", timer: 90 },
                { name: "Barra de Porta (Negativas)", desc: "4 séries de 4-6 descidas", img: "https://placehold.co/600x300/1f2937/10b981?text=Barra+Fixa", timer: 90 },
                { name: "Desenvolvimento Halteres", desc: "3 séries de 10-12 reps", img: "https://placehold.co/600x300/1f2937/10b981?text=Desenvolvimento", timer: 60 },
                { name: "Remada Curvada (Barra W)", desc: "3 séries de 10-12 reps", img: "https://placehold.co/600x300/1f2937/10b981?text=Remada", timer: 60 },
                { name: "Rosca Direta + Flexão", desc: "3 séries de 12 reps cada (Biset)", img: "https://placehold.co/600x300/1f2937/10b981?text=Biset+Bracos", timer: 60 }
            ],
            quarta: [
                { name: "Corrida Intervalada (Esteira)", desc: "30min total. 2min a 9.5km/h / 2min a 5.5km/h", img: "https://placehold.co/600x300/1f2937/10b981?text=Esteira+Ritmo", timer: 0 }
            ],
            sexta: [
                { name: "Agachamento Livre", desc: "4 séries de 10-12 reps", img: "https://placehold.co/600x300/1f2937/10b981?text=Agachamento", timer: 90 },
                { name: "Stiff (Barra Maciça)", desc: "4 séries de 10 reps", img: "https://placehold.co/600x300/1f2937/10b981?text=Stiff", timer: 90 },
                { name: "Avanço/Passada", desc: "3 séries de 10 passos/perna", img: "https://placehold.co/600x300/1f2937/10b981?text=Avanco", timer: 60 },
                { name: "Elevação Pélvica", desc: "3 séries de 12-15 reps", img: "https://placehold.co/600x300/1f2937/10b981?text=Pelvica", timer: 60 },
                { name: "Circuito de Core", desc: "Prancha (45s) + Abdominal (20x) - 3 voltas", img: "https://placehold.co/600x300/1f2937/10b981?text=Core", timer: 0 }
            ],
            domingo: [
                { name: "Corrida Endurance", desc: "Meta inicial: 3.5km contínuos a 8.0km/h", img: "https://placehold.co/600x300/1f2937/10b981?text=Esteira+Longo", timer: 0 }
            ]
        };

        let appData = JSON.parse(localStorage.getItem('appTreinoDados')) || {};
        let countdownInterval;
        let timeLeft = 0;

        // Renderiza os exercícios do dia
        function loadWorkout() {
            const day = document.getElementById('workoutSelect').value;
            const container = document.getElementById('exerciseContainer');
            container.innerHTML = '';

            const dayData = appData[day] || {};

            workouts[day].forEach((ex, index) => {
                const savedHistory = dayData[`ex-${index}`] || '';
                
                const card = `
                    <div class="bg-gray-800 rounded-xl overflow-hidden border border-gray-700 shadow-md">
                        <img src="${ex.img}" alt="${ex.name}" class="w-full h-32 object-cover opacity-80">
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-bold text-gray-100 text-lg">${ex.name}</h3>
                                    <p class="text-sm text-emerald-400">${ex.desc}</p>
                                </div>
                                ${ex.timer > 0 ? `<button onclick="startTimer(${ex.timer})" class="bg-gray-700 hover:bg-gray-600 text-white rounded-full w-10 h-10 flex items-center justify-center transition" title="Iniciar Descanso"><i class="fa-solid fa-clock"></i></button>` : ''}
                            </div>
                            <div class="mt-3">
                                <label class="text-xs text-gray-400 mb-1 block">Registro (Pesos e Repetições):</label>
                                <textarea id="${day}-ex-${index}" rows="2" placeholder="Ex: S1 20kgx10, S2 24kgx8..." class="w-full bg-gray-900 text-gray-200 p-2 rounded-lg border border-gray-600 focus:outline-none focus:border-emerald-500 text-sm resize-none">${savedHistory}</textarea>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Salva no LocalStorage
        function saveProgress() {
            const day = document.getElementById('workoutSelect').value;
            if (!appData[day]) appData[day] = {};

            workouts[day].forEach((_, index) => {
                const inputVal = document.getElementById(`${day}-ex-${index}`).value;
                appData[day][`ex-${index}`] = inputVal;
            });

            localStorage.setItem('appTreinoDados', JSON.stringify(appData));
            
            // Feedback visual do botão
            const btn = document.querySelector('button[onclick="saveProgress()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> Salvo com sucesso!';
            btn.classList.add('bg-emerald-400');
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('bg-emerald-400');
            }, 2000);
        }

        // Exportar para JSON
        function exportData() {
            const dataStr = JSON.stringify(appData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `meu_treino_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Importar JSON
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    appData = importedData;
                    localStorage.setItem('appTreinoDados', JSON.stringify(appData));
                    loadWorkout();
                    alert("Dados importados com sucesso! 🚀");
                } catch (err) {
                    alert("Erro ao ler o arquivo JSON. Verifique se o formato está correto.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset input
        }

        // Sistema de Timer
        function startTimer(seconds) {
            clearInterval(countdownInterval);
            timeLeft = seconds;
            updateTimerDisplay();
            
            document.getElementById('timerBar').classList.remove('translate-y-full');

            countdownInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    navigator.vibrate([200, 100, 200]); // Vibra o celular quando acaba
                    setTimeout(stopTimer, 3000);
                }
            }, 1000);
        }

        function addTime(seconds) {
            timeLeft += seconds;
            updateTimerDisplay();
        }

        function stopTimer() {
            clearInterval(countdownInterval);
            document.getElementById('timerBar').classList.add('translate-y-full');
        }

        function updateTimerDisplay() {
            const mins = Math.floor(Math.max(0, timeLeft) / 60).toString().padStart(2, '0');
            const secs = (Math.max(0, timeLeft) % 60).toString().padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${mins}:${secs}`;
        }

        // Inicialização
        window.onload = loadWorkout;
    </script>
</body>
</html>
