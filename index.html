<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino Pro App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
        /* Remove setas do input number */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans pb-32" id="app">

    <div v-if="showExportModal" class="fixed inset-0 bg-black/90 flex flex-col items-center justify-center p-4 z-50">
        <div class="bg-gray-800 p-4 rounded-xl w-full max-w-2xl h-[80vh] flex flex-col shadow-2xl border border-gray-600">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-emerald-400"><i class="fa-solid fa-code"></i> Dados (JSON)</h2>
                <button @click="showExportModal = false" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-xmark fa-xl"></i></button>
            </div>
            <p class="text-xs text-gray-400 mb-2">Copie o conteúdo abaixo ou visualize seu histórico e configuração:</p>
            <textarea readonly class="w-full flex-1 bg-gray-900 text-emerald-300 font-mono text-xs p-4 rounded border border-gray-700 resize-none focus:outline-none">{{ jsonOutput }}</textarea>
        </div>
    </div>

    <header class="bg-gray-800 shadow-md sticky top-0 z-10 border-b border-gray-700">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-emerald-400"><i class="fa-solid fa-dumbbell"></i> Workout Pro</h1>
            </div>
            <div class="flex gap-3">
                <button @click="openExportModal" class="text-gray-300 hover:text-white" title="Exportar JSON"><i class="fa-solid fa-file-export"></i></button>
            </div>
        </div>
        
        <div class="max-w-md mx-auto px-2 py-2 flex gap-2 overflow-x-auto items-center">
            <div v-for="(w, idx) in appData.workouts" :key="w.id" class="flex shrink-0 items-center bg-gray-700 rounded-lg overflow-hidden">
                <button @click="activeWorkoutIdx = idx" :class="['px-4 py-2 text-sm font-bold transition', activeWorkoutIdx === idx ? 'bg-emerald-500 text-gray-900' : 'text-gray-300']">
                    {{ w.name || 'Treino Sem Nome' }}
                </button>
                <div v-if="activeWorkoutIdx === idx" class="flex flex-col bg-gray-600 text-xs">
                    <button @click.stop="moveWorkout(idx, -1)" class="px-2 hover:bg-gray-500"><i class="fa-solid fa-caret-up"></i></button>
                    <button @click.stop="moveWorkout(idx, 1)" class="px-2 hover:bg-gray-500"><i class="fa-solid fa-caret-down"></i></button>
                </div>
            </div>
            <button @click="addWorkout" class="shrink-0 px-3 py-2 bg-gray-700 text-emerald-400 rounded-lg hover:bg-gray-600"><i class="fa-solid fa-plus"></i></button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6" v-if="currentWorkout">
        
        <section class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg">
            <div class="flex justify-between items-start mb-2">
                <input v-model="currentWorkout.name" @change="saveData" placeholder="Nome do Treino" class="font-bold text-xl bg-transparent border-b border-dashed border-gray-500 focus:border-emerald-500 focus:outline-none w-3/4 text-emerald-400">
                <button @click="deleteWorkout(activeWorkoutIdx)" class="text-red-400 text-sm"><i class="fa-solid fa-trash"></i> Excluir Treino</button>
            </div>
            <label class="text-xs text-gray-400 block mt-2">Observações gerais do treino:</label>
            <textarea v-model="currentWorkout.notes" @change="saveData" placeholder="Ex: Focar na cadência hoje..." class="w-full bg-gray-900 text-gray-200 p-2 rounded mt-1 border border-gray-700 text-sm focus:outline-none resize-none" rows="2"></textarea>
        </section>

        <section class="space-y-6">
            <div v-for="(ex, idx) in currentWorkout.exercises" :key="ex.id" class="bg-gray-800 rounded-xl overflow-hidden border border-gray-700 shadow-md">
                
                <div class="relative group">
                    <img :src="ex.image" class="w-full h-40 object-cover opacity-80" @error="ex.image = 'https://placehold.co/600x200/1f2937/10b981?text=Imagem+Indisponivel'">
                    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition p-4">
                        <input v-model="ex.image" @change="saveData" placeholder="Cole a URL do GIF aqui" class="w-full bg-gray-900 text-white text-xs p-2 rounded border border-gray-500">
                    </div>
                </div>

                <div class="p-4">
                    <div class="flex justify-between items-start mb-3">
                        <input v-model="ex.name" @change="saveData" placeholder="Nome do Exercício" class="font-bold text-lg bg-transparent border-b border-dashed border-gray-500 focus:outline-none w-[70%] text-gray-100">
                        
                        <div class="flex gap-2 text-gray-400">
                            <button @click="moveExercise(idx, -1)" title="Subir"><i class="fa-solid fa-arrow-up"></i></button>
                            <button @click="moveExercise(idx, 1)" title="Descer"><i class="fa-solid fa-arrow-down"></i></button>
                            <button @click="deleteExercise(idx)" class="text-red-400 ml-2" title="Remover"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 mb-3 bg-gray-900 p-2 rounded-lg border border-gray-700">
                        <div>
                            <label class="text-[10px] uppercase text-gray-500 block mb-1">Séries</label>
                            <input v-model="ex.sets" @change="saveData" placeholder="Ex: 4" class="w-full bg-transparent text-center font-bold text-emerald-400 focus:outline-none focus:bg-gray-700 rounded">
                        </div>
                        <div class="border-l border-r border-gray-700 px-1">
                            <label class="text-[10px] uppercase text-gray-500 block mb-1 text-center">Reps</label>
                            <input v-model="ex.reps" @change="saveData" placeholder="Ex: 8-10" class="w-full bg-transparent text-center font-bold text-emerald-400 focus:outline-none focus:bg-gray-700 rounded">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase text-gray-500 block mb-1 text-center">Pausa (s)</label>
                            <div class="flex items-center justify-center gap-1">
                                <input v-model="ex.rest" @change="saveData" type="number" placeholder="90" class="w-10 bg-transparent text-center font-bold text-emerald-400 focus:outline-none focus:bg-gray-700 rounded">
                                <button @click="startTimer(ex.rest)" class="text-emerald-500 hover:text-white"><i class="fa-solid fa-play"></i></button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Cargas e Observações do Exercício:</label>
                        <textarea v-model="ex.notes" @change="saveData" placeholder="Anote seus pesos aqui. Ex: S1: 20kg, S2: 22kg..." class="w-full bg-gray-900 text-gray-200 p-2 rounded-lg border border-gray-700 text-sm focus:outline-none focus:border-emerald-500 resize-none" rows="2"></textarea>
                    </div>
                </div>
            </div>

            <button @click="addExercise" class="w-full py-3 border-2 border-dashed border-gray-600 rounded-xl text-gray-400 hover:text-emerald-400 hover:border-emerald-400 transition">
                <i class="fa-solid fa-plus"></i> Adicionar Novo Exercício
            </button>
        </section>

        <div class="pt-6">
            <button @click="completeWorkout" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-4 px-4 rounded-xl transition duration-200 shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                <i class="fa-solid fa-check-double mr-2"></i> Registrar Treino Concluído
            </button>
        </div>

    </main>

    <div :class="['fixed bottom-0 left-0 w-full bg-gray-800 border-t border-gray-700 p-4 transform transition-transform duration-300 z-40 shadow-[0_-4px_15px_rgba(0,0,0,0.5)]', timerActive ? 'translate-y-0' : 'translate-y-full']">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-stopwatch text-3xl text-emerald-400 animate-pulse"></i>
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider">Descanso</p>
                    <p class="text-3xl font-mono font-bold text-white">{{ formattedTime }}</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button @click="timeLeft += 30" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-bold text-gray-200">+30s</button>
                <button @click="stopTimer" class="bg-red-500/20 text-red-400 hover:bg-red-500/40 px-4 py-2 rounded-lg"><i class="fa-solid fa-xmark fa-lg"></i></button>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        // O JSON Base com os treinos que montei para você, incluindo GIFs do Tenor
        const defaultData = {
            workouts: [
                {
                    id: "w_1",
                    name: "Segunda: Superiores",
                    notes: "Foco na recuperação estrutural pós-cirurgia.",
                    exercises: [
                        { id: "e_11", name: "Supino Reto (Barra Maciça)", sets: "4", reps: "8-10", rest: 90, notes: "", image: "https://media.tenor.com/tZ2eY5A9_f0AAAAC/bench-press.gif" },
                        { id: "e_12", name: "Barra de Porta (Negativas)", sets: "4", reps: "4-6", rest: 90, notes: "Focar na fase excêntrica (descida de 5s).", image: "https://media.tenor.com/9v4E7mI4z7QAAAAC/pull-up.gif" },
                        { id: "e_13", name: "Desenvolvimento Halteres", sets: "3", reps: "10-12", rest: 60, notes: "Banco inclinado.", image: "https://media.tenor.com/NlU3iX6U7_AAAAAC/dumbbell-shoulder-press.gif" },
                        { id: "e_14", name: "Remada Curvada (Barra W)", sets: "3", reps: "10-12", rest: 60, notes: "", image: "https://media.tenor.com/Z4w2M4p2D30AAAAC/barbell-row.gif" },
                        { id: "e_15", name: "Rosca Direta + Flexão", sets: "3", reps: "12", rest: 60, notes: "Super-série sem descanso.", image: "https://media.tenor.com/7D-w6i-e5pEAAAAC/bicep-curl.gif" }
                    ]
                },
                {
                    id: "w_2",
                    name: "Quarta: Corrida Ritmo",
                    notes: "Esteira. Alternar 2min a 9.5km/h com 2min a 5.5km/h.",
                    exercises: [
                        { id: "e_21", name: "Corrida Intervalada", sets: "1", reps: "30 min", rest: 0, notes: "Aquecer 5 min a 6.0km/h antes do bloco central.", image: "https://media.tenor.com/5OQ5U5q4gOMAAAAC/treadmill.gif" }
                    ]
                },
                {
                    id: "w_3",
                    name: "Sexta: Inferiores e Core",
                    notes: "Base para preparar as pernas para os 21km.",
                    exercises: [
                        { id: "e_31", name: "Agachamento Livre", sets: "4", reps: "10-12", rest: 90, notes: "Com halteres ao lado do corpo.", image: "https://media.tenor.com/k_9dYV6h26wAAAAC/squat.gif" },
                        { id: "e_32", name: "Stiff (Barra Maciça)", sets: "4", reps: "10", rest: 90, notes: "Dobradiça de quadril pura.", image: "https://media.tenor.com/Fw5xS4_A7J8AAAAC/romanian-deadlift.gif" },
                        { id: "e_33", name: "Avanço/Passada", sets: "3", reps: "10/perna", rest: 60, notes: "", image: "https://media.tenor.com/1G6f-3D_y1IAAAAC/lunge.gif" },
                        { id: "e_34", name: "Elevação Pélvica", sets: "3", reps: "12-15", rest: 60, notes: "Costas no banco reclinável.", image: "https://media.tenor.com/V7R_9Y_M34IAAAAC/hip-thrust.gif" },
                        { id: "e_35", name: "Circuito Core", sets: "3", reps: "Máx", rest: 0, notes: "Prancha 45s + Abdominal Supra x20", image: "https://media.tenor.com/YwNq6V7Z9a0AAAAC/plank.gif" }
                    ]
                }
            ],
            history: [] // Aqui entrarão os treinos concluídos
        };

        createApp({
            data() {
                return {
                    appData: { workouts: [], history: [] },
                    activeWorkoutIdx: 0,
                    
                    // Timer
                    timerActive: false,
                    timeLeft: 0,
                    intervalId: null,
                    
                    // Modal
                    showExportModal: false,
                    jsonOutput: ""
                };
            },
            computed: {
                currentWorkout() {
                    return this.appData.workouts[this.activeWorkoutIdx] || null;
                },
                formattedTime() {
                    const m = Math.floor(this.timeLeft / 60).toString().padStart(2, '0');
                    const s = (this.timeLeft % 60).toString().padStart(2, '0');
                    return `${m}:${s}`;
                }
            },
            methods: {
                loadData() {
                    const saved = localStorage.getItem('WorkoutProData');
                    if (saved) {
                        try {
                            this.appData = JSON.parse(saved);
                        } catch (e) {
                            this.appData = JSON.parse(JSON.stringify(defaultData));
                        }
                    } else {
                        this.appData = JSON.parse(JSON.stringify(defaultData));
                    }
                },
                saveData() {
                    localStorage.setItem('WorkoutProData', JSON.stringify(this.appData));
                },
                
                // --- Manipulação de Treinos ---
                addWorkout() {
                    this.appData.workouts.push({
                        id: "w_" + Date.now(),
                        name: "Novo Treino",
                        notes: "",
                        exercises: []
                    });
                    this.activeWorkoutIdx = this.appData.workouts.length - 1;
                    this.saveData();
                },
                deleteWorkout(idx) {
                    if(confirm("Tem certeza que deseja excluir este treino inteiro?")) {
                        this.appData.workouts.splice(idx, 1);
                        this.activeWorkoutIdx = Math.max(0, idx - 1);
                        this.saveData();
                    }
                },
                moveWorkout(idx, dir) {
                    const newIdx = idx + dir;
                    if (newIdx >= 0 && newIdx < this.appData.workouts.length) {
                        const temp = this.appData.workouts[idx];
                        this.appData.workouts.splice(idx, 1);
                        this.appData.workouts.splice(newIdx, 0, temp);
                        this.activeWorkoutIdx = newIdx;
                        this.saveData();
                    }
                },

                // --- Manipulação de Exercícios ---
                addExercise() {
                    this.currentWorkout.exercises.push({
                        id: "e_" + Date.now(),
                        name: "",
                        sets: "3", reps: "10", rest: 60, notes: "",
                        image: "https://placehold.co/600x300/374151/10b981?text=Novo+Exercicio"
                    });
                    this.saveData();
                },
                deleteExercise(idx) {
                    this.currentWorkout.exercises.splice(idx, 1);
                    this.saveData();
                },
                moveExercise(idx, dir) {
                    const newIdx = idx + dir;
                    const arr = this.currentWorkout.exercises;
                    if (newIdx >= 0 && newIdx < arr.length) {
                        const temp = arr[idx];
                        arr.splice(idx, 1);
                        arr.splice(newIdx, 0, temp);
                        this.saveData();
                    }
                },

                // --- Histórico / Conclusão ---
                completeWorkout() {
                    const w = this.currentWorkout;
                    const log = {
                        logId: Date.now(),
                        date: new Date().toLocaleString('pt-BR'),
                        workoutName: w.name,
                        snapshot: JSON.parse(JSON.stringify(w)) // Grava os pesos e notas exatos deste dia
                    };
                    this.appData.history.unshift(log); // Adiciona no início
                    this.saveData();
                    alert(`✅ Parabéns! O treino "${w.name}" foi registrado no histórico.`);
                },

                // --- Exportação ---
                openExportModal() {
                    this.jsonOutput = JSON.stringify(this.appData, null, 4);
                    this.showExportModal = true;
                },

                // --- Timer ---
                startTimer(seconds) {
                    if (!seconds || seconds <= 0) return;
                    this.timerActive = true;
                    this.timeLeft = parseInt(seconds);
                    clearInterval(this.intervalId);
                    
                    this.intervalId = setInterval(() => {
                        this.timeLeft--;
                        if (this.timeLeft <= 0) {
                            this.stopTimer();
                            if(navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 500]);
                        }
                    }, 1000);
                },
                stopTimer() {
                    this.timerActive = false;
                    clearInterval(this.intervalId);
                }
            },
            mounted() {
                this.loadData();
            }
        }).mount('#app');
    </script>
</body>
</html>
